<div class="container-fluid p-4 bg-light min-vh-100">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Roles y Permisos</h2>
      <p class="text-muted small">Configuración de niveles de acceso - SUDAB</p>
    </div>
    <button class="btn btn-primary shadow-sm px-4 rounded-3">
      <i class="bi bi-plus-lg me-2"></i> Nuevo Rol
    </button>
  </div>

  <div class="row">
    @for (rol of roles; track rol.idRol) {
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100 border-0 shadow-sm rounded-4 role-card">
          <div class="card-body p-4">
            
            <div class="d-flex justify-content-between align-items-start">
              <div class="icon-box rounded-3 shadow-sm">
                <i class="bi bi-shield-lock-fill fs-3 text-primary"></i>
              </div>
              <div class="action-buttons">
                <button class="btn btn-link text-primary p-0 me-2" (click)="editarRol(rol)">
                  <i class="bi bi-pencil-square fs-5"></i>
                </button>
                <button class="btn btn-link text-danger p-0" (click)="eliminarRol(rol.idRol)">
                  <i class="bi bi-trash fs-5"></i>
                </button>
              </div>
            </div>

            <div class="mt-4">
              <h4 class="fw-bold text-dark mb-1">{{ rol.nombre }}</h4>
              <p class="text-muted small">Acceso Nivel: {{ rol.idRol }}</p>
            </div>

            <p class="text-secondary small mt-3">
              Permisos configurados para el perfil de {{ rol.nombre | lowercase }}.
              Control total sobre los módulos asignados.
            </p>

            <div class="mt-4 pt-3 border-top">
              <div class="d-flex flex-wrap gap-2">
                <span class="badge rounded-pill bg-primary-subtle text-primary px-3 py-2">Leer</span>
                <span class="badge rounded-pill bg-primary-subtle text-primary px-3 py-2">Escribir</span>
                <span class="badge rounded-pill bg-primary-subtle text-primary px-3 py-2">+ Permisos</span>
              </div>
            </div>

          </div>
        </div>
      </div>
    }
  </div>
</div>
